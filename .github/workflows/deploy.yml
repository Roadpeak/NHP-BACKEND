name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nhp-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name (GHCR requires lowercase)
        id: img
        run: echo "name=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + config to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 2222
          source: "docker-compose.prod.yml,nginx/nginx.conf,docker/entrypoint.sh"
          target: "/home/deploy/nhp/"
          overwrite: true

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          APP_ROLE_PASSWORD: ${{ secrets.APP_ROLE_PASSWORD }}
          AUDIT_WRITER_ROLE_PASSWORD: ${{ secrets.AUDIT_WRITER_ROLE_PASSWORD }}
          AUDITOR_ROLE_PASSWORD: ${{ secrets.AUDITOR_ROLE_PASSWORD }}
          ANALYST_ROLE_PASSWORD: ${{ secrets.ANALYST_ROLE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          BLIND_INDEX_PEPPER: ${{ secrets.BLIND_INDEX_PEPPER }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          TEST_HOOK_SECRET: ${{ secrets.TEST_HOOK_SECRET }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          AT_USERNAME: ${{ secrets.AT_USERNAME }}
          AT_SENDER_ID: ${{ secrets.AT_SENDER_ID }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          # First-run SUPER_ADMIN bootstrap — entrypoint refuses on second run,
          # so setting these once and leaving them here is safe.
          NHP_ADMIN_PHONE: ${{ secrets.NHP_ADMIN_PHONE }}
          NHP_ADMIN_ID: ${{ secrets.NHP_ADMIN_ID }}
          NHP_ADMIN_GIVEN: ${{ secrets.NHP_ADMIN_GIVEN }}
          NHP_ADMIN_FAMILY: ${{ secrets.NHP_ADMIN_FAMILY }}
          NHP_ADMIN_COUNTY: ${{ secrets.NHP_ADMIN_COUNTY }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 2222
          envs: IMAGE_TAG,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,APP_ROLE_PASSWORD,AUDIT_WRITER_ROLE_PASSWORD,AUDITOR_ROLE_PASSWORD,ANALYST_ROLE_PASSWORD,JWT_SECRET,FIELD_ENCRYPTION_KEY,BLIND_INDEX_PEPPER,CORS_ORIGIN,TEST_HOOK_SECRET,AT_API_KEY,AT_USERNAME,AT_SENDER_ID,LOG_LEVEL,NHP_ADMIN_PHONE,NHP_ADMIN_ID,NHP_ADMIN_GIVEN,NHP_ADMIN_FAMILY,NHP_ADMIN_COUNTY,GHCR_PULL_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /home/deploy/nhp

            chmod +x docker/entrypoint.sh

            umask 077
            cat > .env.new <<EOF
            IMAGE_TAG=${IMAGE_TAG}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB:-nhp}
            APP_ROLE_PASSWORD=${APP_ROLE_PASSWORD}
            AUDIT_WRITER_ROLE_PASSWORD=${AUDIT_WRITER_ROLE_PASSWORD}
            AUDITOR_ROLE_PASSWORD=${AUDITOR_ROLE_PASSWORD}
            ANALYST_ROLE_PASSWORD=${ANALYST_ROLE_PASSWORD}
            JWT_SECRET="${JWT_SECRET}"
            FIELD_ENCRYPTION_KEY="${FIELD_ENCRYPTION_KEY}"
            BLIND_INDEX_PEPPER="${BLIND_INDEX_PEPPER}"
            CORS_ORIGIN=${CORS_ORIGIN:-https://nationalhealthportal.com,https://www.nationalhealthportal.com,https://citizen.nationalhealthportal.com,https://worker.nationalhealthportal.com,https://facility.nationalhealthportal.com,https://ministry.nationalhealthportal.com}
            TEST_HOOK_SECRET=${TEST_HOOK_SECRET:-}
            AT_API_KEY=${AT_API_KEY:-}
            AT_USERNAME=${AT_USERNAME:-}
            AT_SENDER_ID=${AT_SENDER_ID:-}
            LOG_LEVEL=${LOG_LEVEL:-info}
            NHP_ADMIN_PHONE=${NHP_ADMIN_PHONE:-}
            NHP_ADMIN_ID=${NHP_ADMIN_ID:-}
            NHP_ADMIN_GIVEN=${NHP_ADMIN_GIVEN:-}
            NHP_ADMIN_FAMILY=${NHP_ADMIN_FAMILY:-}
            NHP_ADMIN_COUNTY=${NHP_ADMIN_COUNTY:-}
            EOF
            mv .env.new .env

            echo "${GHCR_PULL_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # postgres first (idempotent), then api recreated with new image.
            SERVICES="postgres api nginx"
            sudo docker compose -f docker-compose.prod.yml pull $SERVICES
            sudo docker compose -f docker-compose.prod.yml up -d $SERVICES
            sudo docker compose -f docker-compose.prod.yml restart nginx
            sudo docker image prune -f

      - name: Verify running containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 2222
          script: |
            cd /home/deploy/nhp
            sleep 15
            sudo docker compose -f docker-compose.prod.yml ps
