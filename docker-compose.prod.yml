# Production stack for NHP-BACKEND on a single droplet.
#
# postgres (postgis) + api + nginx sidecar. Deploys via
# `docker compose -f docker-compose.prod.yml pull|up -d`.
# On-droplet .env supplies IMAGE_TAG and all secrets.

name: nhp

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      # Superuser used ONLY for prisma migrate + harden on boot. The app
      # process connects as the `nhp_app` role that harden.sql creates.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nhp}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-nhp}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    networks: [nhp_net]

  api:
    image: ghcr.io/roadpeak/nhp-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/sbin/tini","--","/entrypoint.sh"]
    command: ["pnpm","--filter","@nhp/api","serve"]
    volumes:
      # Entrypoint runs `prisma migrate deploy` + `prisma harden` before
      # exec-ing Fastify. Kept out of the image so the same image can boot
      # against different DBs without a rebuild.
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
    environment:
      NODE_ENV: production
      PORT: "4400"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Superuser URL for migrate + harden only.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nhp}
      # Application connects as the isolated app role — created by harden.
      APP_DATABASE_URL: postgresql://nhp_app:${APP_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB:-nhp}
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD}
      AUDIT_WRITER_ROLE_PASSWORD: ${AUDIT_WRITER_ROLE_PASSWORD}
      AUDITOR_ROLE_PASSWORD: ${AUDITOR_ROLE_PASSWORD}
      ANALYST_ROLE_PASSWORD: ${ANALYST_ROLE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Field-level crypto. Rotating either after data lands makes existing
      # encrypted rows unreadable and breaks blind-index lookups — set once,
      # keep forever.
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      BLIND_INDEX_PEPPER: ${BLIND_INDEX_PEPPER}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://nationalhealthportal.com,https://www.nationalhealthportal.com,https://citizen.nationalhealthportal.com,https://worker.nationalhealthportal.com,https://facility.nationalhealthportal.com,https://ministry.nationalhealthportal.com}
      TEST_HOOK_SECRET: ${TEST_HOOK_SECRET:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      # First-run SUPER_ADMIN bootstrap. Absent → entrypoint skips; present →
      # entrypoint runs `pnpm ministry:bootstrap` once (refuses on second run).
      NHP_ADMIN_PHONE:  ${NHP_ADMIN_PHONE:-}
      NHP_ADMIN_ID:     ${NHP_ADMIN_ID:-}
      NHP_ADMIN_GIVEN:  ${NHP_ADMIN_GIVEN:-}
      NHP_ADMIN_FAMILY: ${NHP_ADMIN_FAMILY:-}
      NHP_ADMIN_COUNTY: ${NHP_ADMIN_COUNTY:-}
    healthcheck:
      test: ["CMD-SHELL","node -e \"require('http').get('http://localhost:4400/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    networks: [nhp_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # CF origin cert lives on the host at /home/deploy/nhp/certs; mounted read-only.
      - /home/deploy/nhp/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    networks: [nhp_net]

  # Frontend is deployed by the sibling repo's workflow. Declared here as
  # an external service the compose file references so `up -d` can start it
  # once its image is pulled. Not touched by backend deploys.
  frontend:
    image: ghcr.io/roadpeak/nph-frontend:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: missing
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: "0.0.0.0"
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    networks: [nhp_net]

volumes:
  pgdata:

networks:
  nhp_net:
